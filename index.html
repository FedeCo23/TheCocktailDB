<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail DB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>🍸 Cocktail DB</h1>

    <!-- Aggiungi un campo di input per la ricerca dei cocktail -->
    <input type="text" id="inputCocktail" placeholder="Cerca un cocktail">

    <button id="cercaCocktail">Cerca</button>

    <!-- Aggiungi un menu a tendina per selezionare la categoria del cocktail -->
    <select id="categoriaCocktail">
        <option value="">Seleziona categoria</option>
    
    </select>

    <button id="filtraCategoria">Filtra</button>

    <button id="cocktailCasuale">🍀 Ti senti fortunato?</button>

    <div id="cocktails"></div>

    <script src="script.js"></script>
</body>

</html>
