<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail DB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>🍸 Cocktail DB</h1>
    <p class="nav-link"><a href="preferiti.html">I miei preferiti ❤️</a></p>

    <!-- Ricerca per nome -->
    <input type="text" id="inputCocktail" placeholder="Cerca un cocktail">
    <button id="cercaCocktail">Cerca</button>

    <!-- Filtro per categoria -->
    <select id="categoriaCocktail" aria-label="Categoria">
        <option value="">Seleziona categoria</option>
    </select>
    <button id="filtraCategoria">Filtra</button>

    <!-- Filtro per tipo -->
    <select id="tipoCocktail" aria-label="Tipo">
        <option value="">Seleziona tipo</option>
    </select>
    <button id="filtraTipo">Filtra</button>

    <!-- Cocktail casuale -->
    <button id="cocktailCasuale">🍀 Ti senti fortunato?</button>

    <div id="cocktails"></div>

    <script src="script.js"></script>
</body>

</html>
