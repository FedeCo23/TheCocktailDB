<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cocktail DB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>🍸 Cocktail DB</h1>
<p><a href="preferiti.html">I miei preferiti ❤️</a></p>
    
    <!-- Aggiungi un campo di input per la ricerca dei cocktail -->
    <input type="text" id="inputCocktail" placeholder="Cerca un cocktail">

    <button id="cercaCocktail">Cerca</button>

    <!-- Aggiungi un menu a tendina per selezionare la categoria del cocktail -->
    <select id="categoriaCocktail">
        <option value="">Seleziona categoria</option>
    
    </select>
<!-- Aggiungi un pulsante per filtrare i cocktail per categoria -->
    <button id="filtraCategoria">Filtra</button>

    <!-- Aggiungi un pulsante per ottenere un cocktail casuale -->
    <button id="cocktailCasuale">🍀 Ti senti fortunato?</button>

    <!-- Aggiungi un menu a tendina per selezionare il tipo di cocktail -->
<select id="tipoCocktail">
    <option value="">Seleziona tipo</option>
</select>

<!-- Aggiungi un pulsante per filtrare i cocktail per tipo -->
<button id="filtraTipo">Filtra</button>

    <div id="cocktails"></div>

    <script src="script.js"></script>
</body>

</html>
